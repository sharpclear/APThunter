subtypes:
  email:
    label: 邮箱服务
    target_tiers: [brand, cloud]
    domains:
      - gmail.com
      - outlook.com
      - hotmail.com
      - live.com
      - mail.ru
      - proton.me
      - protonmail.com
      - yahoo.com
      - yandex.com
    slds: [gmail, outlook, hotmail, webmail, protonmail, proton, yahoo, yandexmail]
    keywords: [gmail, outlook, hotmail, webmail, email, mail, mailbox, protonmail, yandex mail]

  social:
    label: 社交平台
    target_tiers: [brand, media]
    domains:
      - facebook.com
      - instagram.com
      - twitter.com
      - x.com
      - linkedin.com
      - tiktok.com
      - telegram.org
      - telegram.me
      - whatsapp.com
      - reddit.com
      - discord.com
