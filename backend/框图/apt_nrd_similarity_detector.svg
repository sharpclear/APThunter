<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040" role="img" aria-label="APT历史域名与新注册域名相似度检测算法框图">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#000"/>
    </marker>
    <marker id="smallArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111"/>
    </marker>
    <style>
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #000; }
      .phase-title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 700; fill: #000; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #000; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #111; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #111; }
      .bold { font-weight: 700; }
      .outer { fill: #fff; stroke: #000; stroke-width: 3; }
      .dash { fill: #fff; stroke: #5b5b5b; stroke-width: 2.5; stroke-dasharray: 8 9; }
      .solid { fill: #fff; stroke: #000; stroke-width: 2; }
      .soft-green { fill: #dcefd7; stroke: #8bb880; stroke-width: 1.5; }
      .soft-blue { fill: #e3f0fb; stroke: #7fb4df; stroke-width: 1.5; }
      .soft-red { fill: #fee5e6; stroke: #ee8d92; stroke-width: 1.5; }
      .soft-purple { fill: #eaddec; stroke: #a983ad; stroke-width: 1.5; }
      .soft-yellow { fill: #fff3d8; stroke: #d7a84a; stroke-width: 1.5; }
      .soft-gray { fill: #f6f6f6; stroke: #222; stroke-width: 1.6; }
      .arrow { stroke: #000; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #111; stroke-width: 2.7; fill: none; marker-end: url(#smallArrow); }
      .mini-red { fill: #ff646b; }
      .mini-blue { fill: #5aaeea; }
      .mini-green { fill: #28a745; }
      .mini-purple { fill: #8b51d6; }
      .mini-yellow { fill: #f2b84b; }
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1040" fill="#fff"/>

  <!-- Column titles -->
  <circle cx="82" cy="54" r="23" fill="#000"/>
  <text x="82" y="63" text-anchor="middle" class="title" fill="#fff" style="font-size:28px;">1</text>
  <text x="118" y="65" class="title">历史 APT 域名种子构建</text>

  <circle cx="689" cy="54" r="23" fill="#000"/>
  <text x="689" y="63" text-anchor="middle" class="title" fill="#fff" style="font-size:28px;">2</text>
  <text x="725" y="65" class="title">NRD 相似检索与重排</text>

  <circle cx="1296" cy="54" r="23" fill="#000"/>
  <text x="1296" y="63" text-anchor="middle" class="title" fill="#fff" style="font-size:28px;">3</text>
  <text x="1332" y="65" class="title">候选筛选与解释输出</text>

  <!-- Outer panels -->
  <rect x="60" y="95" width="540" height="770" rx="78" class="outer"/>
  <rect x="680" y="95" width="540" height="770" rx="78" class="outer"/>
  <rect x="1300" y="95" width="540" height="770" rx="78" class="outer"/>

  <path d="M610 480 H668" class="arrow"/>
  <path d="M1230 480 H1288" class="arrow"/>

  <!-- Column 1: positive seed index -->
  <text x="330" y="145" text-anchor="middle" class="phase-title">Positive Seed Preparation</text>

  <rect x="112" y="174" width="196" height="78" rx="14" class="soft-red"/>
  <text x="210" y="204" text-anchor="middle" class="label bold">历史 APT 域名</text>
  <text x="210" y="231" text-anchor="middle" class="small">训练黑数据.xlsx</text>

  <rect x="352" y="174" width="196" height="78" rx="14" class="soft-blue"/>
  <text x="450" y="204" text-anchor="middle" class="label bold">多格式数据读取</text>
  <text x="450" y="231" text-anchor="middle" class="small">TXT / CSV / XLSX / ZIP</text>

  <path d="M210 254 V278 H330" class="thin-arrow"/>
  <path d="M450 254 V278 H330" class="thin-arrow"/>

  <rect x="112" y="288" width="436" height="74" rx="16" class="soft-gray"/>
  <text x="330" y="316" text-anchor="middle" class="label bold">域名规范化与结构解析</text>
  <text x="330" y="342" text-anchor="middle" class="small">domain · SLD · suffix · subdomain</text>

  <path d="M330 364 V382" class="thin-arrow"/>

  <rect x="112" y="390" width="436" height="266" rx="36" class="dash"/>
  <text x="330" y="422" text-anchor="middle" class="phase-title">Infrastructure Route Classification</text>

  <rect x="132" y="446" width="180" height="56" rx="10" class="soft-green"/>
  <text x="222" y="470" text-anchor="middle" class="small bold">A · 注册域名种子</text>
  <text x="222" y="490" text-anchor="middle" class="tiny">registered domain</text>

  <rect x="348" y="446" width="180" height="56" rx="10" class="soft-gray"/>
  <text x="438" y="470" text-anchor="middle" class="small bold">B · 共享平台</text>
  <text x="438" y="490" text-anchor="middle" class="tiny">pages / workers / DDNS</text>

  <rect x="132" y="520" width="180" height="56" rx="10" class="soft-blue"/>
  <text x="222" y="544" text-anchor="middle" class="small bold">C · 子域/疑似失陷</text>
  <text x="222" y="564" text-anchor="middle" class="tiny">subdomain / business-like</text>

  <rect x="348" y="520" width="180" height="56" rx="10" class="soft-red"/>
  <text x="438" y="544" text-anchor="middle" class="small bold">D · DGA / 随机串</text>
  <text x="438" y="564" text-anchor="middle" class="tiny">dga_score ≥ 0.68</text>

  <rect x="240" y="594" width="180" height="48" rx="10" class="soft-yellow"/>
  <text x="330" y="624" text-anchor="middle" class="small bold">E · 仿冒诱导词</text>

  <path d="M330 658 V680" class="thin-arrow"/>

  <rect x="154" y="690" width="352" height="56" rx="12" class="soft-purple"/>
  <text x="330" y="714" text-anchor="middle" class="label bold">仅 A / E 路由进入相似度索引</text>
  <text x="330" y="736" text-anchor="middle" class="tiny">INDEX_ROUTES</text>

  <path d="M330 748 V772" class="thin-arrow"/>

  <rect x="142" y="782" width="376" height="58" rx="14" class="solid"/>
  <text x="330" y="807" text-anchor="middle" class="label bold">字符 3–5 gram TF-IDF 索引</text>
  <text x="330" y="830" text-anchor="middle" class="tiny">IDF · 稀疏向量 · 倒排表</text>

  <!-- Column 2: retrieval and scoring -->
  <text x="950" y="145" text-anchor="middle" class="phase-title">Retrieval, Re-ranking &amp; DGA Fusion</text>

  <rect x="742" y="174" width="416" height="78" rx="14" class="soft-gray"/>
  <text x="950" y="204" text-anchor="middle" class="label bold">新注册域名 NRD 输入</text>
  <text x="950" y="231" text-anchor="middle" class="small">文件 / 目录 · 去重 · max_nrd</text>

  <path d="M950 254 V278" class="thin-arrow"/>

  <rect x="742" y="288" width="416" height="74" rx="16" class="soft-blue"/>
  <text x="950" y="316" text-anchor="middle" class="label bold">规范化、合法性校验与 SLD 解析</text>
  <text x="950" y="342" text-anchor="middle" class="small">normalize_domain · is_domain_like</text>

  <path d="M950 364 V388" class="thin-arrow"/>

  <rect x="730" y="398" width="440" height="270" rx="34" class="dash"/>
  <text x="950" y="430" text-anchor="middle" class="phase-title">Transparent Similarity Scoring</text>

  <rect x="750" y="450" width="190" height="64" rx="10" class="soft-blue"/>
  <text x="845" y="475" text-anchor="middle" class="small bold">TF-IDF Top-K 召回</text>
  <text x="845" y="498" text-anchor="middle" class="tiny">cosine · top_k = 10</text>

  <rect x="960" y="450" width="190" height="64" rx="10" class="soft-red"/>
  <text x="1055" y="475" text-anchor="middle" class="small bold">启发式 DGA 分数</text>
  <text x="1055" y="498" text-anchor="middle" class="tiny">entropy · digit · vowel · runs</text>

  <path d="M845 516 V536" class="thin-arrow"/>

  <rect x="750" y="542" width="190" height="108" rx="10" class="soft-green"/>
  <text x="845" y="568" text-anchor="middle" class="small bold">域名对特征</text>
  <text x="845" y="590" text-anchor="middle" class="tiny">Levenshtein · Jaro-Winkler</text>
  <text x="845" y="611" text-anchor="middle" class="tiny">3-gram Jaccard · prefix/suffix</text>
  <text x="845" y="632" text-anchor="middle" class="tiny">token · length · digit position</text>

  <path d="M942 596 H956" class="thin-arrow"/>

  <rect x="960" y="542" width="190" height="108" rx="10" class="soft-purple"/>
  <text x="1055" y="568" text-anchor="middle" class="small bold">加权重排分数</text>
  <text x="1055" y="590" text-anchor="middle" class="tiny">0.42 TF-IDF + 0.15 Lev</text>
  <text x="1055" y="611" text-anchor="middle" class="tiny">+ JW / Jaccard / token / prefix</text>
  <text x="1055" y="632" text-anchor="middle" class="tiny">hyphen 与数字位置惩罚</text>

  <path d="M1055 516 V532 H1144 V674 H1068" class="thin-arrow"/>
  <path d="M1055 652 V680" class="thin-arrow"/>

  <rect x="820" y="690" width="260" height="62" rx="13" class="soft-yellow"/>
  <text x="950" y="716" text-anchor="middle" class="small bold">相似度与 DGA 信号融合</text>
  <text x="950" y="738" text-anchor="middle" class="tiny">final = max(rerank, 0.75 × DGA)</text>

  <path d="M950 754 V772" class="thin-arrow"/>

  <rect x="758" y="782" width="384" height="58" rx="14" class="soft-red"/>
  <text x="950" y="807" text-anchor="middle" class="label bold">阈值过滤：final_score ≥ 0.55</text>
  <text x="950" y="830" text-anchor="middle" class="tiny">DGA threshold 0.72 · boost floor 0.35</text>

  <!-- Column 3: candidate outputs -->
  <text x="1570" y="145" text-anchor="middle" class="phase-title">Candidate Screening &amp; Explainability</text>

  <rect x="1342" y="166" width="456" height="420" rx="12" class="dash"/>
  <text x="1368" y="206" class="phase-title">1. 候选判定与解释</text>

  <rect x="1378" y="236" width="170" height="64" rx="10" class="soft-purple"/>
  <text x="1463" y="262" text-anchor="middle" class="small bold">相似度候选</text>
  <text x="1463" y="284" text-anchor="middle" class="tiny">matched_positive</text>

  <rect x="1592" y="236" width="170" height="64" rx="10" class="soft-red"/>
  <text x="1677" y="262" text-anchor="middle" class="small bold">DGA-only 候选</text>
  <text x="1677" y="284" text-anchor="middle" class="tiny">可选独立输出分支</text>

  <path d="M1463 302 V324 H1570" class="thin-arrow"/>
  <path d="M1677 302 V324 H1570" class="thin-arrow"/>

  <rect x="1386" y="336" width="368" height="98" rx="12" class="soft-gray"/>
  <text x="1570" y="362" text-anchor="middle" class="label bold">可解释原因标签</text>
  <text x="1570" y="387" text-anchor="middle" class="small">similar_to_history · token_overlap</text>
  <text x="1570" y="410" text-anchor="middle" class="small">common_prefix / suffix · same_suffix · dga_like</text>

  <path d="M1570 436 V456" class="thin-arrow"/>

  <rect x="1386" y="464" width="368" height="84" rx="12" class="soft-blue"/>
  <text x="1570" y="490" text-anchor="middle" class="label bold">候选记录与特征明细</text>
  <text x="1570" y="514" text-anchor="middle" class="small">route · matched_positive · final_score</text>
  <text x="1570" y="536" text-anchor="middle" class="tiny">tfidf / rerank / dga / reasons / features_json</text>

  <text x="1570" y="568" text-anchor="middle" class="small bold" fill="#b4232c">候选筛查 ≠ APT 归因或恶意性最终判决</text>

  <rect x="1342" y="606" width="456" height="216" rx="12" class="dash"/>
  <text x="1368" y="646" class="phase-title">2. 输出文件</text>

  <rect x="1370" y="674" width="400" height="62" rx="12" class="soft-green"/>
  <text x="1570" y="700" text-anchor="middle" class="label bold">候选 CSV</text>
  <text x="1570" y="723" text-anchor="middle" class="tiny">apt_nrd_similarity_candidates.csv</text>

  <path d="M1570 738 V752" class="thin-arrow"/>

  <rect x="1370" y="760" width="400" height="54" rx="12" class="soft-purple"/>
  <text x="1570" y="783" text-anchor="middle" class="small bold">运行摘要 JSON</text>
  <text x="1570" y="804" text-anchor="middle" class="tiny">路由计数 · 参数 · 输入/输出数量 · 运行耗时</text>

  <!-- Legend -->
  <line x1="82" y1="910" x2="1818" y2="910" stroke="#000" stroke-width="2"/>
  <text x="82" y="968" class="label bold">图例</text>

  <rect x="150" y="944" width="28" height="28" rx="5" class="soft-red"/>
  <rect x="188" y="944" width="28" height="28" rx="5" class="soft-blue"/>
  <text x="240" y="967" class="label">输入数据与独立检测分支</text>

  <rect x="540" y="944" width="72" height="34" rx="10" class="dash"/>
  <text x="636" y="968" class="label">虚线框：算法阶段边界</text>

  <rect x="992" y="944" width="32" height="32" rx="7" class="soft-purple"/>
  <rect x="1032" y="944" width="32" height="32" rx="7" class="soft-yellow"/>
  <text x="1090" y="968" class="label">评分、融合与阈值模块</text>

  <path d="M1482 960 H1554" class="arrow"/>
  <text x="1584" y="968" class="label">数据流与决策流</text>
</svg>
