<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1040" viewBox="0 0 1900 1040" role="img" aria-label="仿冒域名检测模块系统框图">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11 Z" fill="#000"/>
    </marker>
    <marker id="smallArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9 Z" fill="#111"/>
    </marker>
    <style>
      .title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 30px; font-weight: 700; fill: #000; }
      .phase-title { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 24px; font-weight: 700; fill: #000; }
      .label { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 21px; fill: #000; }
      .small { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 17px; fill: #111; }
      .tiny { font-family: Arial, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; font-size: 14px; fill: #111; }
      .bold { font-weight: 700; }
      .outer { fill: #fff; stroke: #000; stroke-width: 3; }
      .dash { fill: #fff; stroke: #5b5b5b; stroke-width: 2.5; stroke-dasharray: 8 9; }
      .solid { fill: #fff; stroke: #000; stroke-width: 2; }
      .soft-green { fill: #dcefd7; stroke: #8bb880; stroke-width: 1.5; }
      .soft-blue { fill: #e3f0fb; stroke: #7fb4df; stroke-width: 1.5; }
      .soft-red { fill: #fee5e6; stroke: #ee8d92; stroke-width: 1.5; }
      .soft-purple { fill: #eaddec; stroke: #a983ad; stroke-width: 1.5; }
      .soft-gray { fill: #f6f6f6; stroke: #222; stroke-width: 1.6; }
      .arrow { stroke: #000; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .thin-arrow { stroke: #111; stroke-width: 2.7; fill: none; marker-end: url(#smallArrow); }
      .mini-red { fill: #ff646b; }
      .mini-blue { fill: #5aaeea; }
      .mini-deep-blue { fill: #3329f5; }
      .mini-green { fill: #28a745; }
      .mini-purple { fill: #8b51d6; }
      .bracket { stroke: #000; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1040" fill="#fff"/>

  <!-- Column titles -->
  <circle cx="82" cy="54" r="23" fill="#000"/>
  <text x="82" y="63" text-anchor="middle" class="title" fill="#fff" style="font-size:28px;">1</text>
  <text x="118" y="65" class="title">目标画像与特征表示</text>

  <circle cx="689" cy="54" r="23" fill="#000"/>
  <text x="689" y="63" text-anchor="middle" class="title" fill="#fff" style="font-size:28px;">2</text>
  <text x="725" y="65" class="title">规则召回与候选评分</text>

  <circle cx="1296" cy="54" r="23" fill="#000"/>
  <text x="1296" y="63" text-anchor="middle" class="title" fill="#fff" style="font-size:28px;">3</text>
  <text x="1332" y="65" class="title">LLM复核与告警输出</text>

  <!-- Outer rounded panels -->
  <rect x="60" y="95" width="540" height="770" rx="78" class="outer"/>
  <rect x="680" y="95" width="540" height="770" rx="78" class="outer"/>
  <rect x="1300" y="95" width="540" height="770" rx="78" class="outer"/>

  <!-- Inter-column arrows -->
  <path d="M610 480 H668" class="arrow"/>
  <path d="M1230 480 H1288" class="arrow"/>

  <!-- Column 1: Target profile -->
  <text x="330" y="145" text-anchor="middle" class="phase-title">Training Phase：官方目标画像构建</text>

  <rect x="112" y="174" width="190" height="86" rx="14" class="soft-red"/>
  <text x="207" y="204" text-anchor="middle" class="label bold">官方域名源</text>
  <text x="207" y="232" text-anchor="middle" class="small">文件 / 检索结果</text>

  <rect x="356" y="174" width="190" height="86" rx="14" class="soft-blue"/>
  <text x="451" y="204" text-anchor="middle" class="label bold">单位名称</text>
  <text x="451" y="232" text-anchor="middle" class="small">组织 / 事件上下文</text>

  <path d="M207 262 V298" class="thin-arrow"/>
  <path d="M451 262 V298" class="thin-arrow"/>

  <rect x="112" y="304" width="436" height="300" rx="42" class="dash"/>
  <text x="330" y="344" text-anchor="middle" class="phase-title">Feature Extraction</text>

  <rect x="148" y="378" width="122" height="64" rx="8" class="solid"/>
  <text x="209" y="404" text-anchor="middle" class="small bold">域名规范化</text>
  <text x="209" y="428" text-anchor="middle" class="tiny">host / registered</text>

  <rect x="392" y="378" width="122" height="64" rx="8" class="solid"/>
  <text x="453" y="404" text-anchor="middle" class="small bold">后缀解析</text>
  <text x="453" y="428" text-anchor="middle" class="tiny">SLD / suffix</text>

  <path d="M272 410 H390" class="thin-arrow"/>

  <rect x="176" y="486" width="112" height="64" rx="8" class="soft-green"/>
  <text x="232" y="512" text-anchor="middle" class="small bold">品牌词</text>
  <text x="232" y="536" text-anchor="middle" class="tiny">strong / medium</text>

  <rect x="334" y="486" width="112" height="64" rx="8" class="soft-purple"/>
  <text x="390" y="512" text-anchor="middle" class="small bold">动态词表</text>
  <text x="390" y="536" text-anchor="middle" class="tiny">short / weak</text>

  <path d="M232 552 V630" class="thin-arrow"/>
  <path d="M390 552 V630" class="thin-arrow"/>

  <text x="330" y="640" text-anchor="middle" class="phase-title">Target Profile</text>
  <path d="M155 674 V742 M155 674 H176 M155 742 H176" class="bracket"/>
  <path d="M505 674 V742 M505 674 H484 M505 742 H484" class="bracket"/>
  <rect x="206" y="682" width="38" height="28" rx="6" class="mini-red"/>
  <rect x="264" y="682" width="38" height="28" rx="6" class="mini-red"/>
  <rect x="322" y="682" width="38" height="28" rx="6" class="mini-red"/>
  <text x="384" y="705" class="label bold">...</text>
  <rect x="438" y="682" width="38" height="28" rx="6" class="mini-red"/>
  <rect x="206" y="722" width="38" height="28" rx="6" class="mini-blue"/>
  <rect x="264" y="722" width="38" height="28" rx="6" class="mini-blue"/>
  <rect x="322" y="722" width="38" height="28" rx="6" class="mini-deep-blue"/>
  <text x="384" y="745" class="label bold" fill="#5aaeea">...</text>
  <rect x="438" y="722" width="38" height="28" rx="6" class="mini-blue"/>

  <text x="330" y="806" text-anchor="middle" class="phase-title">官方域名、单位名称与目标词一致表示</text>

  <!-- Column 2: Candidate generation and scoring -->
  <text x="950" y="145" text-anchor="middle" class="phase-title">Testing Phase：待测域名候选召回</text>

  <rect x="742" y="172" width="416" height="86" rx="16" class="soft-gray"/>
  <text x="950" y="203" text-anchor="middle" class="label bold">新增 / 上传待测域名</text>
  <text x="950" y="231" text-anchor="middle" class="small">daily data · manual input · subscription task</text>

  <path d="M950 260 V296" class="thin-arrow"/>

  <rect x="730" y="304" width="440" height="280" rx="40" class="dash"/>
  <text x="950" y="344" text-anchor="middle" class="phase-title">Rule-based Candidate Mining</text>

  <rect x="772" y="382" width="150" height="56" rx="10" class="soft-green"/>
  <text x="847" y="406" text-anchor="middle" class="small bold">目标词命中</text>
  <text x="847" y="427" text-anchor="middle" class="tiny">exact / fuzzy</text>

  <rect x="976" y="382" width="150" height="56" rx="10" class="soft-red"/>
  <text x="1051" y="406" text-anchor="middle" class="small bold">风险上下文</text>
  <text x="1051" y="427" text-anchor="middle" class="tiny">login / auth / mail</text>

  <rect x="772" y="480" width="150" height="56" rx="10" class="soft-blue"/>
  <text x="847" y="504" text-anchor="middle" class="small bold">结构异常</text>
  <text x="847" y="525" text-anchor="middle" class="tiny">hyphen / digit / long</text>

  <rect x="976" y="480" width="150" height="56" rx="10" class="soft-purple"/>
  <text x="1051" y="504" text-anchor="middle" class="small bold">后缀证据</text>
  <text x="1051" y="525" text-anchor="middle" class="tiny">TLD / suffix change</text>

  <path d="M922 410 H974" class="thin-arrow"/>
  <path d="M922 508 H974" class="thin-arrow"/>
  <path d="M950 584 V623" class="thin-arrow"/>

  <rect x="760" y="636" width="380" height="72" rx="16" class="soft-green"/>
  <text x="950" y="665" text-anchor="middle" class="label bold">CANINE 歧义候选复核</text>
  <text x="950" y="694" text-anchor="middle" class="small">仅处理规则召回后的低置信候选</text>

  <path d="M950 710 V738" class="thin-arrow"/>

  <rect x="760" y="746" width="380" height="68" rx="16" class="solid"/>
  <text x="950" y="775" text-anchor="middle" class="label bold">阈值过滤与最终风险分</text>
  <text x="950" y="802" text-anchor="middle" class="small">GLOBAL_MIN_SCORE · category threshold</text>

  <!-- Column 3: LLM and outputs -->
  <text x="1570" y="145" text-anchor="middle" class="phase-title">LLM Review &amp; Alert Delivery</text>

  <rect x="1342" y="166" width="456" height="214" rx="12" class="dash"/>
  <text x="1368" y="206" class="phase-title">1. Training Phase</text>
  <rect x="1395" y="232" width="350" height="52" rx="8" class="soft-green"/>
  <text x="1570" y="266" text-anchor="middle" class="label bold">Prompt 与 JSON Schema 约束</text>
  <path d="M1570 286 V316" class="thin-arrow"/>
  <rect x="1395" y="320" width="350" height="38" rx="8" class="soft-purple"/>
  <text x="1570" y="345" text-anchor="middle" class="small">标签、风险分、研判原因、处置结果</text>

  <rect x="1342" y="414" width="456" height="408" rx="12" class="dash"/>
  <text x="1368" y="454" class="phase-title">2. Testing Phase</text>

  <path d="M1392 492 V544 M1392 492 H1412 M1392 544 H1412" class="bracket"/>
  <path d="M1748 492 V544 M1748 492 H1728 M1748 544 H1728" class="bracket"/>
  <rect x="1440" y="502" width="36" height="24" rx="5" class="mini-red"/>
  <rect x="1494" y="502" width="36" height="24" rx="5" class="mini-red"/>
  <rect x="1548" y="502" width="36" height="24" rx="5" class="mini-red"/>
  <text x="1610" y="523" class="label bold">...</text>
  <rect x="1666" y="502" width="36" height="24" rx="5" class="mini-red"/>
  <rect x="1440" y="538" width="36" height="24" rx="5" class="mini-blue"/>
  <rect x="1494" y="538" width="36" height="24" rx="5" class="mini-blue"/>
  <rect x="1548" y="538" width="36" height="24" rx="5" class="mini-deep-blue"/>
  <text x="1610" y="559" class="label bold" fill="#5aaeea">...</text>
  <rect x="1666" y="538" width="36" height="24" rx="5" class="mini-blue"/>
  <text x="1570" y="590" text-anchor="middle" class="small">批量候选：域名、官方域名、单位名称、算法证据</text>

  <path d="M1570 598 V628" class="thin-arrow"/>
  <rect x="1400" y="638" width="340" height="56" rx="10" class="soft-blue"/>
  <text x="1570" y="674" text-anchor="middle" class="label bold">Claude Opus 4.8 二次研判</text>
  <path d="M1570 696 V724" class="thin-arrow"/>

  <rect x="1378" y="734" width="170" height="50" rx="10" class="soft-red"/>
  <text x="1463" y="765" text-anchor="middle" class="small bold">保留高危告警</text>
  <rect x="1592" y="734" width="170" height="50" rx="10" class="soft-green"/>
  <text x="1677" y="765" text-anchor="middle" class="small bold">保留人工复核</text>
  <path d="M1548 759 H1588" class="thin-arrow"/>

  <path d="M1463 786 V812" class="thin-arrow"/>
  <path d="M1677 786 V812" class="thin-arrow"/>
  <rect x="1362" y="820" width="416" height="1" fill="none"/>

  <!-- Output strip in column 3 -->
  <rect x="1352" y="804" width="116" height="44" rx="6" class="soft-gray"/>
  <text x="1410" y="832" text-anchor="middle" class="tiny bold">任务结果</text>
  <rect x="1496" y="804" width="116" height="44" rx="6" class="soft-gray"/>
  <text x="1554" y="832" text-anchor="middle" class="tiny bold">Excel 附件</text>
  <rect x="1640" y="804" width="116" height="44" rx="6" class="soft-gray"/>
  <text x="1698" y="832" text-anchor="middle" class="tiny bold">飞书推送</text>

  <!-- Bottom legend -->
  <line x1="82" y1="910" x2="1818" y2="910" stroke="#000" stroke-width="2"/>
  <text x="82" y="968" class="label bold">图例</text>
  <rect x="120" y="944" width="28" height="28" rx="5" class="mini-red"/>
  <rect x="158" y="944" width="28" height="28" rx="5" class="mini-blue"/>
  <text x="210" y="967" class="label">官方目标 / 待测域名特征</text>

  <rect x="492" y="944" width="72" height="34" rx="10" class="dash"/>
  <text x="588" y="968" class="label">虚线框：训练 / 测试阶段边界</text>

  <rect x="926" y="944" width="32" height="32" rx="7" class="soft-green"/>
  <rect x="966" y="944" width="32" height="32" rx="7" class="soft-red"/>
  <text x="1024" y="968" class="label">LLM处置结果：人工复核 / 高危告警</text>

  <path d="M1410 960 H1488" class="arrow"/>
  <text x="1518" y="968" class="label">数据流与决策流</text>
</svg>
